<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategos: The Peloponnesian Escape</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-gold: #d29922;
            --accent-blue: #58a6ff;
            --accent-red: #f85149;
            --accent-green: #3fb950;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: var(--accent-gold);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #8b949e;
            background: #0d1117;
            padding: 8px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .room-image {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .context-box {
            background: #0d1117;
            border-left: 4px solid var(--accent-blue);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px 18px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #30363d;
            border-color: var(--accent-blue);
        }

        .ending-box {
            text-align: center;
            padding: 20px;
        }

        .ending-title {
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .historical { color: var(--accent-gold); }
        .athenian-win { color: var(--accent-green); }
        .spartan-win { color: var(--accent-red); }

        .reset-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>STRATEGOS: THE PELOPONNESIAN WAR</h1>
        <div>Delian League War Council</div>
    </header>

    <div id="game-ui">
        <div class="status-bar">
            <span>Chamber: <strong id="chamber-num">1</strong> / 7</span>
            <span>League Alignment Score: <strong id="score-val">0</strong></span>
        </div>

        <img id="visual-clue" class="room-image" src="" alt="Visual Clue">

        <div class="context-box" id="context-text">
            Loading campaign briefing...
        </div>

        <div class="options-container" id="options-box"></div>
    </div>

    <div id="ending-ui" style="display: none;" class="ending-box">
        <h2 id="ending-title" class="ending-title"></h2>
        <p id="ending-desc"></p>
        <button class="reset-btn" onclick="resetGame()">Replay Campaign</button>
    </div>
</div>

<script>
const chambers = [
    {
        id: 1,
        title: "Chamber I: The Epidamnus Incident (431 BCE)",
        image: "1st choice.jpg",
        context: "Clue Inspection: Maps indicate Corinthian intervention in Epidamnus. Corcyra (Corfu) possesses the second-largest fleet in Greece and requests an alliance with Athens. Sparta threatens war if Athens intervenes.",
        options: [
            { text: "Form a strictly defensive alliance (Epimachia) with Corcyra, sending only 10 triremes.", type: "H", score: 0 },
            { text: "Commit full naval force (100 triremes) immediately to annihilate the Corinthian fleet at Sybota.", type: "A", score: 1 },
            { text: "Reject Corcyra outright to appease Sparta and preserve peace at all costs.", type: "S", score: -1 }
        ]
    },
    {
        id: 2,
        title: "Chamber II: Pericles' Strategy (431 BCE)",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Parthenon_from_west.jpg/1024px-Parthenon_from_west.jpg",
        context: "Clue Inspection: King Archidamus II leads the Spartan army into Attica. Athenian farmers flee inside the Long Walls. The Assembly demands you march out to fight the Spartans in pitched land battle.",
        options: [
            { text: "Refuse land battle; withdraw behind the Long Walls and rely on maritime resupply.", type: "H", score: 0 },
            { text: "Use triremes to execute continuous amphibious raids on the Peloponnesian coast, cutting Spartan supplies.", type: "A", score: 1 },
            { text: "March the Athenian hoplites out to meet Sparta in open field combat outside Athens.", type: "S", score: -1 }
        ]
    },
    {
        id: 3,
        title: "Chamber III: The Plague of Athens (430 BCE)",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Trireme_1.jpg/1024px-Trireme_1.jpg",
        context: "Clue Inspection: Overcrowding within the walls triggers a devastating epidemic. Pericles falls ill. Public panic mounts and peace envoys are requested.",
        options: [
            { text: "Maintain defense while sending small naval expeditions to Potidaea to maintain military focus.", type: "H", score: 0 },
            { text: "Evacuate non-combatants via the fleet to Delian allies, quarantining the city while keeping naval operations active.", type: "A", score: 1 },
            { text: "Surrender immediately to Sparta to request medical aid and end the blockade.", type: "S", score: -1 }
        ]
    },
    {
        id: 4,
        title: "Chamber IV: The Fortification of Pylos (425 BCE)",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Map_Greece_ancient_world-en.svg/1024px-Map_Greece_ancient_world-en.svg.png",
        context: "Clue Inspection: General Demosthenes fortifies Pylos on the Peloponnesian coast. 420 elite Spartan hoplites are trapped on the adjacent island of Sphacteria.",
        options: [
            { text: "Reject Spartan peace offers; deploy Cleon with light infantry to assault Sphacteria and capture the hoplites.", type: "H", score: 0 },
            { text: "Accept Spartan peace offer immediately in exchange for favorable territorial concessions and end the war early.", type: "A", score: 1 },
            { text: "Abandon Pylos as too risky and recall Demosthenes back to Athens.", type: "S", score: -1 }
        ]
    },
    {
        id: 5,
        title: "Chamber V: The Sicilian Expedition (415 BCE)",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Syracuse_map_ancient.svg/800px-Syracuse_map_ancient.svg.png",
        context: "Clue Inspection: Segesta requests help against Syracuse. Alcibiades advocates a massive armada; Nicias warns it will drain Athenian resources.",
        options: [
            { text: "Send a massive force under divided command (Nicias, Alcibiades, Lamachus).", type: "H", score: 0 },
            { text: "Reject the Sicilian expedition entirely; concentrate all power on securing Thrace and the Hellespont.", type: "A", score: 1 },
            { text: "Send a small, underfunded force to Syracuse without naval support.", type: "S", score: -1 }
        ]
    },
    {
        id: 6,
        title: "Chamber VI: The Decelean War & Persian Gold (413–412 BCE)",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Daric_Type_III_Detail.jpg/800px-Daric_Type_III_Detail.jpg",
        context: "Clue Inspection: Sparta fortifies Decelea inside Attica and negotiates with Persia for gold to build a navy. Athenian allies in Ionia threaten rebellion.",
        options: [
            { text: "Use emergency reserve funds (1,000 talents) to rebuild the fleet and fight in the Aegean.", type: "H", score: 0 },
            { text: "Offer Persia a counter-alliance by ceding disputed Asian territories in exchange for Persian neutrality.", type: "A", score: 1 },
            { text: "Disband the Aegean fleet to save costs and retreat permanently inside Athenian walls.", type: "S", score: -1 }
        ]
    },
    {
        id: 7,
        title: "Chamber VII: Battle of Aegospotami (405 BCE)",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Ancient_Greek_hoplite_and_phalanx.jpg/800px-Ancient_Greek_hoplite_and_phalanx.jpg",
        context: "Clue Inspection: The Athenian fleet is beached at Aegospotami. Lysander’s Spartan fleet watches from across the Hellespont. Alcibiades warns that the beachhead position is defenseless.",
        options: [
            { text: "Ignore Alcibiades' advice; keep the fleet stationed at Aegospotami.", type: "H", score: 0 },
            { text: "Relocate the fleet immediately to the fortified harbor of Sestos as advised.", type: "A", score: 1 },
            { text: "Disembark the crews entirely to forage inland, leaving ships completely unmanned.", type: "S", score: -1 }
        ]
    }
];

let currentChamber = 0;
let totalScore = 0;
let historyChoicesCount = 0;

function loadChamber() {
    const data = chambers[currentChamber];
    document.getElementById("chamber-num").innerText = data.id;
    document.getElementById("score-val").innerText = totalScore;
    document.getElementById("visual-clue").src = data.image;
    document.getElementById("context-text").innerText = data.context;

    const optionsBox = document.getElementById("options-box");
    optionsBox.innerHTML = "";

    data.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.score, opt.type);
        optionsBox.appendChild(btn);
    });
}

function selectOption(score, type) {
    totalScore += score;
    if (type === "H") {
        historyChoicesCount++;
    }

    currentChamber++;

    if (currentChamber < chambers.length) {
        loadChamber();
    } else {
        renderEnding();
    }
}

function renderEnding() {
    document.getElementById("game-ui").style.display = "none";
    const endingUI = document.getElementById("ending-ui");
    endingUI.style.display = "block";

    const titleEl = document.getElementById("ending-title");
    const descEl = document.getElementById("ending-desc");

    if (historyChoicesCount === 7) {
        titleEl.innerText = "HISTORICAL ENDING: The Fall of Athens (404 BCE)";
        titleEl.className = "ending-title historical";
        descEl.innerText = "You made every decision exactly as recorded by Thucydides and Xenophon. Following the catastrophe at Aegospotami and the siege of Athens, the Long Walls are demolished to the sound of Peloponnesian flutes. Athens surrenders, ending the Delian League.";
    } else if (totalScore >= 4) {
        titleEl.innerText = "DECISIVE ATHENIAN VICTORY: Hegemony Secured";
        titleEl.className = "ending-title athenian-win";
        descEl.innerText = "By avoiding strategic blunders in Sicily and securing key diplomatic levers with Persia and Corcyra, your fleet dominated the Aegean. Sparta, starved of naval funding and crippled by Helot unrest, signs a humiliating treaty. Athens stands supreme over Hellas!";
    } else {
        titleEl.innerText = "DECISIVE SPARTAN VICTORY: Rapid Athenian Collapse";
        titleEl.className = "ending-title spartan-win";
        descEl.innerText = "Poor tactical choices and premature land battles broke Athenian power years ahead of schedule. Sparta and her allies breach the Long Walls early, dismantling democracy and installing the Thirty Tyrants.";
    }
}

function resetGame() {
    currentChamber = 0;
    totalScore = 0;
    historyChoicesCount = 0;
    document.getElementById("ending-ui").style.display = "none";
    document.getElementById("game-ui").style.display = "block";
    loadChamber();
}

window.onload = loadChamber;
</script>
</body>
</html>
