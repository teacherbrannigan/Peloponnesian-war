<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategos: The Peloponnesian Escape</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-gold: #d29922;
            --accent-blue: #58a6ff;
            --accent-red: #f85149;
            --accent-green: #3fb950;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            color: var(--accent-gold);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #8b949e;
            background: #0d1117;
            padding: 8px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .room-image {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .context-box {
            background: #0d1117;
            border-left: 4px solid var(--accent-blue);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px 18px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #30363d;
            border-color: var(--accent-blue);
        }

        .ending-box {
            text-align: center;
            padding: 20px;
        }

        .ending-title {
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .historical { color: var(--accent-gold); }
        .athenian-win { color: var(--accent-green); }
        .spartan-win { color: var(--accent-red); }

        .reset-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>STRATEGOS: THE PELOPONNESIAN WAR</h1>
        <div>Delian League War Council</div>
    </header>

    <div id="game-ui">
        <div class="status-bar">
            <span>Chamber: <strong id="chamber-num">1</strong> / 7</span>
            <span>League Alignment Score: <strong id="score-val">0</strong></span>
        </div>

        <img id="visual-clue" class="room-image" src="" alt="Visual Clue">

        <div class="context-box" id="context-text">
            Loading campaign briefing...
        </div>

        <div class="options-container" id="options-box"></div>
    </div>

    <div id="ending-ui" style="display: none;" class="ending-box">
        <h2 id="ending-title" class="ending-title"></h2>
        <p id="ending-desc"></p>
        <button class="reset-btn" onclick="resetGame()">Replay Campaign</button>
    </div>
</div>
